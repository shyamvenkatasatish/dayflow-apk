name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK with Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then cp index.html www/index.html; fi
          if [ -f "DayFlow.html" ]; then cp DayFlow.html www/index.html; fi
          if [ ! -f "www/index.html" ]; then
            echo "ERROR: Upload DayFlow.html or index.html to the repository first."
            exit 1
          fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "DayFlow" "com.dayflow.app" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DayFlow-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
